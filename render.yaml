# Render Blueprint Configuration for Fear 4Fangz
# Ready to deploy directly to https://render.com
services:
  - type: web
    name: fear-4fangz
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
